name: Allara Health
description: 'Allara Health is a telehealth platform specializing in women''s hormonal, metabolic,
  and gynecological health. Founded by Rachel Blank following her own PCOS diagnosis, Allara
  connects patients with dedicated multidisciplinary care teams of board-certified physicians,
  OB-GYNs, endocrinologists, nurse practitioners, and registered dietitians who deliver
  personalized treatment through virtual visits. The platform treats complex conditions
  including PCOS, insulin resistance, endometriosis, thyroid disorders, fertility concerns,
  and other metabolic and endocrine issues, combining medical care, nutrition counseling,
  advanced testing, lifestyle support, and medication when appropriate. Allara accepts most
  insurance plans and offers self-pay options. Surfaced as a portfolio company of GV and
  added to the API Evangelist network; Allara is a consumer telehealth service with no public
  developer API surface at the time of enrichment.'
